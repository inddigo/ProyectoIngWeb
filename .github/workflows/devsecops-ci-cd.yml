name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Mínimo privilegio: el token de GitHub solo puede leer el repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Variables no sensibles: GitHub Actions Variables (Settings > Variables) con valores por defecto
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}

jobs:
  # ---------------------------------------------------------------- Seguridad
  secrets-scan:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks sobre todo el historial
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  sast:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep (TypeScript, Python, Dockerfile, nginx, GitHub Actions)
        run: |
          semgrep scan --config p/default --config p/typescript --config p/python \
            --error --metrics=off --exclude frontend/android .

  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend NestJS (lint, pruebas, build, dependencias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-nestjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint (ESLint + Prettier)
        run: npm run lint && npm run format:check
      - name: Pruebas unitarias con cobertura
        run: npm run test:cov
      - run: npm run build
      - name: Auditoría de dependencias (bloquea HIGH/CRITICAL)
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------- Frontend
  frontend:
    name: Frontend Angular/Ionic (lint, pruebas, build, dependencias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (angular-eslint)
        run: npm run lint
      - name: Pruebas unitarias (Karma, Chrome headless)
        run: npm run test:ci
      - name: Build web/PWA
        run: npx ng build --configuration production
      - name: Build para Android (Capacitor)
        run: npx ng build --configuration android && npx cap sync android
      - name: Auditoría de dependencias de runtime (bloquea HIGH/CRITICAL)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------- Python
  python:
    name: Servicio Python FastAPI (lint, pruebas, dependencias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: service-python/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check . && ruff format --check .
      - name: Pruebas unitarias con cobertura
        run: pytest --cov=app --cov-report=term-missing
      - name: Auditoría de dependencias (pip-audit)
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------- IaC
  terraform:
    name: Terraform (fmt, validate, plan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD || 'ci-placeholder' }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET || 'ci-placeholder' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Terraform plan (staging)
        env:
          # Sin credenciales GCP se ejecuta un plan "offline" (sin refrescar estado)
          # que verifica la configuración completa sin tocar la nube.
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ secrets.GCP_ACCESS_TOKEN || 'offline-plan' }}
        run: |
          terraform plan -input=false -refresh=false -lock=false \
            -var-file=environments/staging.tfvars.example \
            -var "project_id=${{ vars.GCP_PROJECT_ID || 'cotiza-staging' }}"

  # ------------------------------------------- Imágenes + integración (gated)
  docker:
    name: Imágenes Docker, escaneo e integración
    runs-on: ubuntu-latest
    # No se construyen imágenes si falla cualquier etapa crítica anterior.
    needs: [secrets-scan, sast, backend, frontend, python, terraform]
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imágenes
        run: docker compose build
      - name: Trivy - backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ingweb-backend-nestjs:latest
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Trivy - servicio Python
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ingweb-python-service:latest
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Trivy - frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ingweb-frontend:latest
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Validar secretos requeridos
        run: |
          if [ -n "$JWT_SECRET" ] && [ ${#JWT_SECRET} -lt 32 ]; then
            echo "::error::El secreto JWT_SECRET tiene ${#JWT_SECRET} caracteres; el backend exige al menos 32 (genera uno con: openssl rand -hex 32)"
            exit 1
          fi
      - name: Levantar stack completo
        run: docker compose up -d --wait --wait-timeout 180
      - name: Prueba de humo de extremo a extremo
        run: ./scripts/smoke-test.sh http://localhost:8080
      - name: Logs ante fallo
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80 backend
          docker compose logs --no-color --tail 40
      - name: Detener stack
        if: always()
        run: docker compose down -v
