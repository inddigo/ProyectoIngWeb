# Levanta toda la plataforma: docker compose up --build
# Variables: copiar .env.example a .env (hay valores por defecto solo para desarrollo).
name: ingweb

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pastry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pastry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pastry_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    build:
      context: ./service-python
    image: ingweb-python-service:latest
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    networks: [backend]

  backend:
    build:
      context: ./backend-nestjs
    image: ingweb-backend-nestjs:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # start.sh arma DATABASE_URL codificando la contraseña
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-pastry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pastry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pastry_db}
      PYTHON_SERVICE_URL: http://python-service:8000
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8100,http://localhost,capacitor://localhost}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "3000:3000"
    networks: [backend, frontend]
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: ingweb-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [frontend]
    depends_on:
      backend:
        condition: service_healthy

networks:
  backend:
  frontend:

volumes:
  pgdata:
