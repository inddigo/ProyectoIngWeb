version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pastry_postgres
    restart: always
    environment:
      POSTGRES_USER: pastry_user
      POSTGRES_PASSWORD: pastry_password
      POSTGRES_DB: pastry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastry_user -d pastry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    build:
      context: ./service-python
      dockerfile: Dockerfile
    container_name: pastry_python_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-nestjs
      dockerfile: Dockerfile
    image: ingweb-backend-nestjs:latest
    container_name: pastry_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://pastry_user:pastry_password@postgres:5432/pastry_db?schema=public
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pastry_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
