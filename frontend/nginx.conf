server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Proxy hacia el backend NestJS (mismo origen: sin CORS en web/PWA)
  location ~ ^/(api|auth|health)(/|$) {
    # BACKEND_ORIGIN se sustituye al arrancar por envsubst (Dockerfile).
    # No proviene de la petición; esta ruta es la API pública, no un proxy abierto.
    # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    proxy_pass ${BACKEND_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # El service worker y el índice no se cachean para recibir actualizaciones
  # (se usa `expires` y no add_header para no anular las cabeceras de seguridad)
  location = /ngsw-worker.js { expires -1; }
  location = /index.html { expires -1; }

  # Archivos con hash: caché larga
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 30d;
    try_files $uri =404;
  }

  # Fallback SPA: las rutas del router de Angular devuelven index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
